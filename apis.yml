name: Cartography Biosciences
description: >-
  Cartography Biosciences is a South San Francisco biotechnology company developing precision cancer
  immunotherapies designed around tumor-selective antigens. Using single-cell genomics, proteomics, and
  novel binder-discovery methods, the company profiles antigen expression across thousands of patient
  samples and millions of cells to build a comprehensive antigen atlas, classifying cancers by antigen
  expression rather than histology or genetic mutation. Its goal is to direct immunotherapies toward the
  safest and most effective targets. Backed by a16z, Cartography was surfaced as an a16z portfolio
  company and added to the API Evangelist network. It publishes a corporate and careers website but no
  public developer API, developer portal, or API documentation.
